name: Framework comparison

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright / TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run test:playwright
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  cypress:
    name: Cypress / TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:cypress
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cypress-evidence
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore
          retention-days: 14

  selenium:
    name: Selenium / C# / NUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore QaFrameworkComparison.sln
      - run: >-
          dotnet test QaFrameworkComparison.sln
          --configuration Release
          --no-restore
          --logger "trx;LogFileName=selenium.trx"
          --results-directory TestResults
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: selenium-evidence
          path: |
            TestResults
            **/test-results
          if-no-files-found: ignore
          retention-days: 14
